const SUPABASE_URL = 'https://xqjxpnzgwrqulqvhpnts.supabase.co';

<style>
:root{--navy:#0a2240;--orange:#f97316;--green:#16a34a;--red:#dc2626;--line:#e2e8f0;--bg:#f3f4f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,sans-serif;color:#172033;padding-bottom:72px}button,input,select{font:inherit}button{cursor:pointer;border:0}
#bossLogin{position:fixed;inset:0;z-index:9999;background:#0a0f1c;display:flex;align-items:center;justify-content:center;padding:20px}
.bossCard{background:#111827;border:1px solid #1f2937;border-radius:20px;width:min(92vw,400px);padding:24px;color:#fff}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.role-btn{padding:14px;border-radius:14px;background:#1f2937;color:#9ca3af;border:2px solid transparent}.role-btn.active{background:#0a2240;border-color:#4ade80;color:#fff}
.boss-input{width:100%;padding:12px;border-radius:12px;background:#1f2937;border:1px solid #374151;color:#fff;margin:6px 0 12px}.login-btn{width:100%;padding:14px;border-radius:12px;background:#4ade80;color:#000;font-weight:900;font-size:16px;margin-top:10px}
.appbar{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.brand{font-weight:900}.brand span{color:#fb923c}.sub{font-size:11px;color:#cbd5e1}.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:210px 1fr 320px;min-height:calc(100vh - 58px)}.sidebar{background:var(--navy);color:#fff;padding:16px;display:flex;flex-direction:column;gap:8px}.navbtn{padding:11px 12px;border-radius:10px;background:transparent;color:#dbeafe;text-align:left}.navbtn.active,.navbtn:hover{background:var(--orange);color:#fff}.sidebar .totals{margin-top:auto;background:#ffffff12;border-radius:12px;padding:12px}.main{padding:18px;min-width:0}.cartpanel{background:#fff;border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;max-height:calc(100vh - 58px);position:sticky;top:58px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.search{max-width:280px;width:45%;padding:10px 14px;border:1px solid var(--line);border-radius:999px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product,.panel,.metric{background:#fff;border:1px solid #edf0f4;border-radius:15px;padding:14px}.price{font-size:19px;font-weight:900;color:var(--orange)}.small{font-size:12px;color:#9ca3af}.pill{font-size:11px;border-radius:99px;padding:4px 8px;background:#f1f5f9}.pill.low{background:#fee2e2;color:#991b1b}.btn{padding:10px 13px;border-radius:10px;font-weight:750}.primary{background:var(--navy);color:#fff}.orange{background:var(--orange);color:#fff}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.light{background:#f1f5f9}.full{width:100%}.field{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;margin:4px 0 8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.formgrid .wide{grid-column:1/-1}.section{margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.listrow{padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.hidden{display:none!important}.bottomnav{display:none}.modal{border:0;border-radius:16px;padding:18px;width:min(92vw,420px)}.modal::backdrop{background:#0008}.live-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}.live-on{background:#22c55e;box-shadow:0 0 8px #22c55e}.live-off{background:#ef4444}
@media(max-width:650px){.layout{display:block}.sidebar{display:none}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;justify-content:space-around;padding:7px 2px;z-index:10}.bottomnav button{background:transparent;color:#b7c5d8;display:flex;flex-direction:column;align-items:center;flex:1;font-size:10px}.bottomnav button.active{color:#fff}}
</style>
</head>
<body>
<div id="bossLogin"><div class="bossCard">
<h2>🛡️ GURU <span>POS</span></h2><div class="sub">Boss v4.1 LIVE • <span id="syncStatus"><span class="live-dot live-off"></span>Connecting</span></div>
<p style="margin:16px 0 6px;font-weight:700">Select Role</p>
<div class="role-grid"><button id="ownerBtn" class="role-btn active" onclick="window.setBossRole('owner')">👔<br><strong>Owner</strong></button><button id="cashierBtn" class="role-btn" onclick="window.setBossRole('cashier')">🧾<br><strong>Cashier</strong></button></div>
<label class="small">Shop ID</label><input id="shopIdInput" class="boss-input" placeholder="SHOP-GURU-123">
<div style="display:flex;gap:8px"><button class="btn light" style="flex:1;background:#374151;color:#fff" onclick="window.genShopIdNow()">🔄 Generate ID</button><button style="flex:1;padding:12px;border-radius:12px;background:transparent;border:1.5px dashed #4ade80;color:#4ade80">📷 Scan</button></div>
<label class="small" style="margin-top:12px;display:block">PIN - 4 digits</label><input id="bossPin" class="boss-input" type="tel" maxlength="4" placeholder="1234">
<button class="login-btn" onclick="window.doBossLoginNow()">Login →</button>
</div></div>

<header class="appbar"><div><div class="brand">GURU <span>POS</span> <small id="roleBadge" style="background:#f97316;padding:2px 8px;border-radius:20px;font-size:10px">BOSS</small></div><div class="sub"><span id="currentShopId"></span> • <span id="liveText">Connecting...</span></div></div><button class="btn orange" onclick="openCart()">Cart <span id="cartBadge">0</span></button></header>
<div class="layout">
<aside class="sidebar"><button class="navbtn active" data-page="sell" onclick="showPage('sell')">🛒 Sell</button><button class="navbtn" data-page="stock" onclick="showPage('stock')">📦 Stock</button><button class="navbtn" data-page="sales" onclick="showPage('sales')">📈 Sales</button><button class="navbtn" data-page="reports" onclick="showPage('reports')">📊 Reports</button><button class="navbtn" data-page="backup" onclick="showPage('backup')">💾 Backup</button>
<div class="totals"><div class="small">Today</div><strong id="sideToday">K 0.00</strong><div class="small" style="margin-top:8px">Debt</div><strong id="sideDebt" style="color:#fca5a5">K 0.00</strong><div id="syncInfo" class="small" style="margin-top:10px">Sync init...</div></div></aside>
<main class="main">
<div class="heading"><h1 id="pageTitle">Sell</h1><input id="search" class="search" placeholder="Search…" oninput="renderProducts()"></div>
<section id="page-sell"><div id="productGrid" class="cards"></div></section>
<section id="page-stock" class="hidden"><div class="panel section"><h3>Add product</h3><form id="productForm" class="formgrid"><input class="field wide" id="pName" placeholder="Product name" required><input class="field" id="pCost" type="number" min="0" step="0.01" placeholder="Cost K" required><input class="field" id="pPrice" type="number" min="0.01" step="0.01" placeholder="Sell K" required><input class="field" id="pQty" type="number" min="0" step="1" placeholder="Qty" required><button class="btn primary" type="submit">Add</button></form></div><div class="panel"><div class="row"><h3>Inventory</h3><span id="stockCount" class="pill">0</span></div><div id="stockList"></div></div></section>
<section id="page-sales" class="hidden"><div class="panel"><h3>Sales</h3><div id="salesList"></div></div></section>
<section id="page-reports" class="hidden"><div class="panel"><h3>Reports</h3><div class="row"><span>Sales</span><strong id="rSales">K 0.00</strong></div><div class="row"><span>Profit</span><strong id="rProfit">K 0.00</strong></div></div></section>
<section id="page-backup" class="hidden"><div class="panel"><h3>Backup</h3><button class="btn light" onclick="exportBackup()">Download</button><input id="restoreFile" type="file" class="field"><button class="btn red" onclick="restoreBackup()">Restore</button><div class="small" style="margin-top:8px">Shop: <span id="backupShop"></span></div><button class="btn light full" style="margin-top:12px" onclick="window.bossLogoutNow()">🚪 Logout</button></div></section>
</main>
<aside class="cartpanel"><div class="row"><h2>Cart</h2><span id="cartCount" class="pill">0</span></div><div id="cartItems" style="flex:1;overflow:auto"></div><div style="border-top:1px solid #e2e8f0;padding-top:12px"><div class="row"><strong>Total</strong><strong id="cartTotal">K 0.00</strong></div><input id="customerName" class="field" placeholder="Customer"><select id="payMethod" class="field"><option value="cash">Cash</option><option value="momo">MoMo</option><option value="bank">Bank</option></select><button class="btn primary full" onclick="checkout('sale')">Complete sale (Live Sync)</button><button class="btn light full" style="margin-top:6px" onclick="clearCart()">Clear</button></div></aside>
</div>
<nav class="bottomnav"><button data-page="sell" class="active" onclick="showPage('sell')">🛒</button><button data-page="stock" onclick="showPage('stock')">📦</button><button data-page="sales" onclick="showPage('sales')">📈</button><button data-page="backup" onclick="showPage('backup')">⚙️</button></nav>

<script>
window.BOSS_ROLE=localStorage.getItem('guru_role')||'owner';
window.getDBKey=()=>{const s=localStorage.getItem('guru_shopId');return s?'guru_pos_v3_data_'+s:'guru_pos_v3_data';}
window.setBossRole=r=>{window.BOSS_ROLE=r;document.getElementById('ownerBtn').classList.toggle('active',r==='owner');document.getElementById('cashierBtn').classList.toggle('active',r==='cashier');}
window.genShopIdNow=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let id='';for(let i=0;i<4;i++)id+=c[Math.floor(Math.random()*c.length)];const s='SHOP-GURU-'+id;document.getElementById('shopIdInput').value=s;return s;}
window.doBossLoginNow=()=>{const shop=document.getElementById('shopIdInput').value.trim().toUpperCase();let pin=document.getElementById('bossPin').value.replace(/\D/g,'').slice(0,4);if(!shop||shop.length<6){alert('Enter Shop ID');return;}if(!/^\d{4}$/.test(pin)){alert('PIN 4 digits');return;}localStorage.setItem('guru_role',window.BOSS_ROLE);localStorage.setItem('guru_shopId',shop);localStorage.setItem('guru_pin',pin);document.getElementById('bossLogin').style.display='none';location.reload();}
window.bossLogoutNow=()=>{if(confirm('Logout?')){localStorage.removeItem('guru_role');localStorage.removeItem('guru_shopId');location.reload();}}
(function(){const r=localStorage.getItem('guru_role'),s=localStorage.getItem('guru_shopId');if(!r||!s){document.getElementById('bossLogin').style.display='flex';window.genShopIdNow();return;}document.getElementById('bossLogin').style.display='none';document.getElementById('currentShopId').textContent=s+' • '+r.toUpperCase();document.getElementById('roleBadge').textContent=r.toUpperCase();document.getElementById('backupShop').textContent=s;})();
</script>

<script>
'use strict';
const DEFAULT_PRODUCTS=[{id:uid(),name:'CALUS Speaker',price:850,cost:600,stock:15},{id:uid(),name:'Samsung A07',price:3200,cost:2800,stock:5},{id:uid(),name:'Samsung A16',price:4500,cost:3900,stock:3}];
const $=id=>document.getElementById(id);
let state=loadState(),cart=[];
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);}
function normalize(x){x.products=x.products||[];x.sales=x.sales||[];x.debts=x.debts||[];x.payments=x.payments||[];x.expenses=x.expenses||[];x.settings=x.settings||{shopName:'GURU POS'};return x}
function loadState(){try{const k=window.getDBKey();const x=JSON.parse(localStorage.getItem(k)||'null');if(x&&x.products)return normalize(x);}catch(e){}return normalize({products:DEFAULT_PRODUCTS,sales:[],debts:[],payments:[],expenses:[]});}
function save(){try{localStorage.setItem(window.getDBKey(),JSON.stringify(state));return true}catch(e){return false}}
function money(n){return 'K '+Number(n||0).toLocaleString('en-ZM',{minimumFractionDigits:2});}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function showPage(p){document.querySelectorAll('main section').forEach(e=>e.classList.add('hidden'));$('page-'+p).classList.remove('hidden');$('pageTitle').textContent=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(p==='stock')renderStock();if(p==='sales')renderSales();if(p==='reports')renderReports();}
function openCart(){renderCart();}
function renderProducts(){const q=($('search').value||'').toLowerCase();const ps=state.products.filter(p=>p.name.toLowerCase().includes(q));$('productGrid').innerHTML=ps.map(p=>`<div class="product"><div class="row"><strong>${esc(p.name)}</strong><span class="pill ${p.stock<=3?'low':''}">${p.stock} left</span></div><div class="price">${money(p.price)}</div><button class="btn primary full" ${p.stock<=0?'disabled':''} onclick="addToCart('${p.id}')">Add</button></div>`).join('')||'No products';}
function addToCart(id){const p=state.products.find(p=>p.id===id);if(!p||p.stock<=0)return;const c=cart.find(c=>c.id===id);if(c){if(c.qty>=p.stock)return alert('Stock limit');c.qty++;}else cart.push({id:p.id,name:p.name,price:p.price,cost:p.cost,qty:1});renderCart();}
function renderCart(){const total=cart.reduce((s,c)=>s+c.price*c.qty,0);$('cartItems').innerHTML=cart.map(c=>`<div style="padding:8px 0;border-bottom:1px solid #e2e8f0"><div class="row"><strong>${esc(c.name)}</strong><button class="btn light" onclick="removeCart('${c.id}')">x</button></div><div class="row"><span>${c.qty} x ${money(c.price)}</span><strong>${money(c.price*c.qty)}</strong></div></div>`).join('')||'Empty';$('cartTotal').textContent=money(total);$('cartBadge').textContent=cart.reduce((s,c)=>s+c.qty,0);$('cartCount').textContent=cart.length;}
function removeCart(id){cart=cart.filter(c=>c.id!==id);renderCart();}
function clearCart(){cart=[];renderCart();}
async function pushToCloud(type,payload){
 if(!supabaseClient)return;
 const shopId=localStorage.getItem('guru_shopId');
 if(!shopId)return;
 try{ await supabaseClient.from('guru_sync').insert({shop_id:shopId,type:type,payload:payload}); }catch(e){console.log(e);}
}
async function checkout(){
 if(!cart.length)return alert('Empty');
 for(const c of cart){const p=state.products.find(p=>p.id===c.id);if(!p||p.stock<c.qty)return alert('Stock changed '+c.name);}
 const total=cart.reduce((s,c)=>s+c.price*c.qty,0);
 const record={id:uid(),date:new Date().toISOString(),customer:$('customerName').value||'Walk-in',total,items:cart.reduce((s,c)=>s+c.qty,0),cart:cart.map(c=>({...c})),shop_id:localStorage.getItem('guru_shopId')};
 cart.forEach(c=>{const p=state.products.find(p=>p.id===c.id);if(p)p.stock-=c.qty;});
 state.sales.push(record); save();
 await pushToCloud('sale',record); await pushToCloud('stock',state.products);
 cart=[];renderAll();alert('✅ Sale LIVE SYNCED! '+money(total));
}
function renderStock(){$('stockCount').textContent=state.products.length;$('stockList').innerHTML=state.products.map(p=>`<div class="listrow"><div><strong>${esc(p.name)}</strong><div class="small">${money(p.price)} · ${p.stock} left</div></div><button class="btn light" onclick="editStock('${p.id}')">Edit</button></div>`).join('');}
function editStock(id){const p=state.products.find(p=>p.id===id);const q=prompt('New stock',p.stock);if(q===null)return;p.stock=Number(q);save();pushToCloud('stock',state.products);renderAll();}
function renderSales(){$('salesList').innerHTML=state.sales.slice(-50).reverse().map(s=>`<div class="listrow"><span>${new Date(s.date).toLocaleString()} · ${esc(s.customer)} · ${money(s.total)}</span></div>`).join('')||'No sales';}
function renderReports(){const today=new Date().toDateString();const todays=state.sales.filter(s=>new Date(s.date).toDateString()===today);$('rSales').textContent=money(todays.reduce((a,s)=>a+s.total,0));$('sideToday').textContent=$('rSales').textContent;}
function renderAll(){renderProducts();renderCart();renderStock();renderSales();renderReports();}
function exportBackup(){const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='guru-backup-'+(localStorage.getItem('guru_shopId')||'shop')+'.json';a.click();}
function restoreBackup(){const f=$('restoreFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=normalize(JSON.parse(r.result));save();renderAll();alert('Restored');}catch(e){alert('Invalid');}};r.readAsText(f);}
renderAll();
async function initLiveSync(){
 if(!supabaseClient){$('syncInfo').textContent='Sync off';$('liveText').textContent='Offline';return;}
 const shopId=localStorage.getItem('guru_shopId'); if(!shopId)return;
 $('syncStatus').innerHTML='<span class="live-dot live-on"></span>Live SYNC'; $('liveText').textContent='Live ON - '+shopId; $('syncInfo').textContent='Syncing '+shopId;
 try{
  const {data}=await supabaseClient.from('guru_sync').select('*').eq('shop_id',shopId).order('created_at',{ascending:true}).limit(200);
  if(data){ const last=[...data].reverse().find(d=>d.type==='stock'); if(last&&Array.isArray(last.payload)){ state.products=last.payload; save(); renderAll(); } }
 }catch(e){}
 const ch=supabaseClient.channel('shop-'+shopId).on('postgres_changes',{event:'INSERT',schema:'public',table:'guru_sync',filter:`shop_id=eq.${shopId}`},p=>{
   const row=p.new; if(row.type==='stock'&&Array.isArray(row.payload)){ state.products=row.payload; save(); renderAll(); console.log('Live stock'); }
   if(row.type==='sale'){ if(!state.sales.find(s=>s.id===row.payload.id)){ state.sales.push(row.payload); save(); renderAll(); } }
 }).subscribe();
}
initLiveSync();
</script>
</body>
